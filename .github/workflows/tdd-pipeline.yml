name: TDD Pipeline

# Quality gates, same commands as CLAUDE.md "Commands".
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: mypy (strictness configured in pyproject.toml)
        run: |
          mypy src


  lint:
    name: Linting (ruff) and Formatting (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check src tests
      - name: black
        run: |
          black --check src tests


  unit-tests:
    name: Unit Tests with Coverage Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Unit tests with coverage
        run: |
          pytest tests/unit --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Overall coverage >= 80 %
        run: |
          coverage report --fail-under=80
      - name: Parser and sanitizer coverage = 100 %
        run: |
          coverage report --include="src/parser.py" --fail-under=100
          coverage report --include="src/sanitizer.py" --fail-under=100
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/


  property-tests:
    name: Property-Based Tests (100 examples each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Property tests (hypothesis profile in tests/conftest.py)
        run: |
          pytest tests -k property --hypothesis-show-statistics --hypothesis-seed=0


  integration-tests:
    name: Integration Tests (moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Integration tests
        run: |
          pytest tests/integration --junitxml=pytest-results/integration.xml
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: pytest-results/


  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: End-to-end tests (live AWS tests are skipped)
        run: |
          pytest tests/e2e --junitxml=pytest-results/e2e.xml
        timeout-minutes: 15
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: pytest-results/


  security-scan:
    name: Security Scanning (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: bandit, medium and high severity (gate)
        run: |
          bandit -r src -ll
      - name: bandit, full JSON report
        if: always()
        run: |
          bandit -r src -f json -o bandit-report.json || true
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: bandit-report.json


  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-tests, property-tests, integration-tests, e2e-tests, security-scan]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "type-check: ${{ needs.type-check.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "property-tests: ${{ needs.property-tests.result }}"
          echo "integration-tests: ${{ needs.integration-tests.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          if [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.property-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "Pipeline failed: one or more gates did not succeed"
            exit 1
          fi
          echo "All quality gates passed"
