[pytest]
# Pytest configuration for AWS Resource Inventory

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.9

# Console output
console_output_style = progress
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --maxfail=1
    -ra

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=src --cov-report=html
# addopts = --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests - test individual functions/classes in isolation
    integration: Integration tests - test interactions between components
    e2e: End-to-end tests - test complete workflows
    property: Property-based tests using Hypothesis
    slow: Tests that take significant time to run (>1 second)
    aws: Tests that interact with AWS services (requires credentials)

# Hypothesis settings for property-based testing
# These ensure consistent behavior across test runs
hypothesis_profile = default

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::boto3.exceptions.PythonDeprecationWarning

# Timeout for tests (requires pytest-timeout plugin)
# timeout = 300

# Asyncio configuration
asyncio_mode = auto
